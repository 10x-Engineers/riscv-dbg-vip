- id: OB-7387CD43
  version: '1.0'
  page: introduction.html
  anchor: 1-1-2-1-3-minor-changes-from-0-13-to-1-0
  heading: 1.1.2.1.3. Minor Changes from 0.13 to 1.0
  area: Intentions and features
  modality: SHOULD
  requirement: 'Technically backwards incompatible, but unlikely to be noticeable: stopcount only applies
    to hart-local counters. #405 version may be invalid when dmactive=0. #414 Address triggers (mcontrol)
    may fire on any accessed address. #421 All Trigger Module registers (Sdtrig.adoc#tab:trigger) are
    optional. #431 When extending IR, bypass still is all ones. #437 ebreaks and ebreaku are WARL. #458
    NMIs are disabled by stepie. #465 R/W1C fields should be cleared by writing every bit high. #472 Specify
    trigger priorities in Sdtrig.adoc#tab:priority relative to exceptions. #478 Time may pass before dmactive
    becomes high. #500 Clear MPRV when resuming into lower privilege mode. #503 Halt state may not be
    preserved across reset. #504 Hardware should clear trigger action when dmode is cleared and action
    is 1. #501 Change quick access exceptions to halt the target in debug_module.adoc#ac-quickaccess.
    #585 Writing 0 to tdata1 forces a state where tdata2 and tdata3 are writable. #598 Solutions to deal
    with reentrancy in Sdtrig.adoc#nativetrigger prevent triggers from matching, not merely firing.'
  url: https://docs.riscv.org/reference/debug/v1.0/introduction.html#1-1-2-1-3-minor-changes-from-0-13-to-1-0
  suspect_empty_xref: false
- id: OB-AA3E9B6B
  version: '1.0'
  page: introduction.html
  anchor: 1-1-2-1-4-new-features-from-0-13-to-1-0
  heading: 1.1.2.1.4. New Features from 0.13 to 1.0
  area: Intentions and features
  modality: MUST
  requirement: 'See custom, and custom0 through custom15. #406 Reserve trigger type values for non-standard
    use. #417 Add nmi bit to itrigger. #408 and #709 Recommend matching on every accessed address. #449
    Add resume groups in debug_module.adoc#hrgroups. #506 Add relaxedpriv . #536 Move scontext, renaming
    original to mscontext, and create hcontext. #535 Add mcontrol6, deprecating mcontrol. #538 Add hypervisor
    support: ebreakvs, ebreakvu, v, hcontext, mcontrol, mcontrol6, and priv. #549 Optionally make anyunavail
    and allunavail sticky, controlled by stickyunavail. #520 Add tmexttrigger to support trigger module
    external trigger inputs. #543 Describe mcontrol and mcontrol6 behavior with atomic instructions. #561
    Trigger hit bits must be set on fire, may be set on match. #593 Add sbytemask and sbytemask to textra32
    and textra64. #588 Allow debugger to request harts stay alive with keepalive bit in setkeepalive.
    #592 Add ndmresetpending to allow a debugger to determine when ndmreset is complete. #594 Add intctl
    to support triggers from an interrupt controller. #599'
  url: https://docs.riscv.org/reference/debug/v1.0/introduction.html#1-1-2-1-4-new-features-from-0-13-to-1-0
  suspect_empty_xref: false
