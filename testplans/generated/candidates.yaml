    anchor: 1-1-2-1-3-minor-changes-from-0-13-to-1-0
    requirement: 'Technically backwards incompatible, but unlikely to be noticeable: stopcount only applies
      to hart-local counters. #405 version may be invalid when dmactive=0. #414 Address triggers (mcontrol)
      may fire on any accessed address. #421 All Trigger Module registers (Sdtrig.adoc#tab:trigger) are
      optional. #431 When extending IR, bypass still is all ones. #437 ebreaks and ebreaku are WARL. #458
      NMIs are disabled by stepie. #465 R/W1C fields should be cleared by writing every bit high. #472
      Specify trigger priorities in Sdtrig.adoc#tab:priority relative to exceptions. #478 Time may pass
      before dmactive becomes high. #500 Clear MPRV when resuming into lower privilege mode. #503 Halt
      state may not be preserved across reset. #504 Hardware should clear trigger action when dmode is
      cleared and action is 1. #501 Change quick access exceptions to halt the target in debug_module.adoc#ac-quickaccess.
      #585 Writing 0 to tdata1 forces a state where tdata2 and tdata3 are writable. #598 Solutions to
      deal with reentrancy in Sdtrig.adoc#nativetrigger prevent triggers from matching, not merely firing.'
    modality: SHOULD
