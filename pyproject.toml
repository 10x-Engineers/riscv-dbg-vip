[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydebug"
version = "0.1.0"
description = "RISC-V Debug Compliance Framework — portable across SoCs and platforms"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "JK"},
]
dependencies = []  # stdlib only — no external deps

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
pydebug = "pydebug.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unknown markers are errors: a typo'd tier marker would otherwise silently drop
# a test out of the smoke regression with no warning.
addopts = "--strict-markers"
markers = [
    "smoke: the one basic, happy-path test for a feature. Runs in the smoke tier.",
    "feature(id): the regressions.json feature this test belongs to. Required on every test.",
    "sim: requires a live simulator; excluded from the mock-only tiers.",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pydebug = [
    "c_bridge/*.c",
    "c_bridge/*.h",
    "sv/**/*.sv",
    "sv/configs/*.json",
    "sv/configs/*.cfg",
]
