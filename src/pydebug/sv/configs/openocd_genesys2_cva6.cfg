# OpenOCD config for CVA6 on a real Genesys2 board (emulation stage).
#
# Adapted from CVA6-fork's own proven corev_apu/fpga/ariane.cfg (FTDI
# layout, timeouts, and sba/virtual-address settings unchanged — those are
# board/RTL-specific and already validated upstream), reformatted into
# pydebug's config style (tcl_port, no trailing interactive halt/echo —
# pydebug's CLI/OpenOCDTransport manages examination and halt itself).

adapter driver ftdi
transport select jtag

ftdi vid_pid 0x0403 0x6010

# Channel 1 is taken by Xilinx's own JTAG/config link on this board.
ftdi channel 0

# Bit0 TCK / Bit1 TDI / Bit2 TDO / Bit3 TMS / Bit4 nTRST (see ariane.cfg
# for the full MPSSE pin-mapping reference).
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -ndata 0x0010

tcl_port 6666

adapter speed 1000

set _CHIPNAME riscv
# CVA6's dmi_jtag is instantiated without an IdcodeValue override in
# ariane_xilinx.sv, so it uses the module default (0x00000001) — same
# value used for the simulation bitbang config (openocd_bitbang_soc.cfg).
set _EXPECTED_ID 0x00000001

jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id $_EXPECTED_ID -ignore-version
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0

gdb report_data_abort enable
gdb report_register_access_error enable

riscv set_reset_timeout_sec 120
riscv set_command_timeout_sec 120

# Prefer abstract-command memory access over system-bus access.
riscv set_prefer_sba off

if { [catch {riscv set_enable_virtual on} ] } {
    echo "Warning: this OpenOCD version does not support address translation."
}

init
