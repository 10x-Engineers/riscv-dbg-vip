<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="900" height="580" fill="#ffffff"/>

  <!-- Box 1: Python test scenario -->
  <rect x="270" y="16" width="360" height="52" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="450" y="37" text-anchor="middle" font-size="15" font-weight="bold">Python Test Scenario</text>
  <text x="450" y="55" text-anchor="middle" font-size="13">(pytest / CLI)</text>
  <line x1="450" y1="68" x2="450" y2="90" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Box 2: RISCVDebug API -->
  <rect x="230" y="92" width="440" height="56" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="450" y="114" text-anchor="middle" font-size="15" font-weight="bold">RISCVDebug — Debug Command API</text>
  <text x="450" y="132" text-anchor="middle" font-size="12.5">halt · resume · read_gpr · read_mem · step</text>
  <line x1="450" y1="148" x2="450" y2="170" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Box 3: DebugTransport ABC (double border = abstract interface) -->
  <rect x="290" y="172" width="320" height="50" rx="4" fill="#f2f2f2" stroke="#000000" stroke-width="1.6"/>
  <rect x="296" y="178" width="308" height="38" rx="3" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="450" y="197" text-anchor="middle" font-size="14.5" font-weight="bold">DebugTransport</text>
  <text x="450" y="213" text-anchor="middle" font-size="11.5" font-style="italic">(abstract read/write interface)</text>

  <!-- Branch lines -->
  <line x1="450" y1="222" x2="450" y2="236" stroke="#000" stroke-width="1.6"/>
  <line x1="450" y1="236" x2="230" y2="236" stroke="#000" stroke-width="1.6"/>
  <line x1="450" y1="236" x2="670" y2="236" stroke="#000" stroke-width="1.6"/>
  <line x1="230" y1="236" x2="230" y2="256" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="670" y1="236" x2="670" y2="256" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Column headers -->
  <text x="230" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a4a7a">PRE-SILICON &#8212; SIMULATION</text>
  <text x="670" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a4a10">POST-SILICON &#8212; EMULATION</text>

  <!-- Left column boxes -->
  <rect x="50" y="258" width="360" height="50" rx="4" fill="#dce9f7" stroke="#1a4a7a" stroke-width="1.6"/>
  <text x="230" y="288" text-anchor="middle" font-size="13.5">UVMTransport (Unix socket, JSON)</text>
  <line x1="230" y1="308" x2="230" y2="328" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="50" y="330" width="360" height="50" rx="4" fill="#dce9f7" stroke="#1a4a7a" stroke-width="1.6"/>
  <text x="230" y="360" text-anchor="middle" font-size="13.5">DPI-C Bridge (uvm_bridge.c)</text>
  <line x1="230" y1="380" x2="230" y2="400" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="50" y="402" width="360" height="50" rx="4" fill="#dce9f7" stroke="#1a4a7a" stroke-width="1.6"/>
  <text x="230" y="425" text-anchor="middle" font-size="13.5">UVM Testbench</text>
  <text x="230" y="442" text-anchor="middle" font-size="11.5">(JTAG sequencer / driver)</text>
  <line x1="230" y1="452" x2="230" y2="472" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="50" y="474" width="360" height="54" rx="4" fill="#c3dbf3" stroke="#1a4a7a" stroke-width="1.8"/>
  <text x="230" y="497" text-anchor="middle" font-size="13.5" font-weight="bold">DUT RTL (CVA6 / Ibex)</text>
  <text x="230" y="514" text-anchor="middle" font-size="11.5">in simulation</text>

  <!-- Right column boxes -->
  <rect x="490" y="258" width="360" height="50" rx="4" fill="#fbe8d2" stroke="#9a4a10" stroke-width="1.6"/>
  <text x="670" y="288" text-anchor="middle" font-size="13.5">OpenOCDTransport (TCP socket, TCL)</text>
  <line x1="670" y1="308" x2="670" y2="328" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="490" y="330" width="360" height="50" rx="4" fill="#fbe8d2" stroke="#9a4a10" stroke-width="1.6"/>
  <text x="670" y="360" text-anchor="middle" font-size="13.5">OpenOCD (riscv dmi_read / dmi_write)</text>
  <line x1="670" y1="380" x2="670" y2="400" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="490" y="402" width="360" height="50" rx="4" fill="#fbe8d2" stroke="#9a4a10" stroke-width="1.6"/>
  <text x="670" y="432" text-anchor="middle" font-size="13.5">JTAG Debug Probe</text>
  <line x1="670" y1="452" x2="670" y2="472" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="490" y="474" width="360" height="54" rx="4" fill="#f5d3ab" stroke="#9a4a10" stroke-width="1.8"/>
  <text x="670" y="497" text-anchor="middle" font-size="13.5" font-weight="bold">DUT Silicon / FPGA</text>
  <text x="670" y="514" text-anchor="middle" font-size="11.5">physical hardware</text>

  <!-- Footer note -->
  <text x="450" y="560" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">Identical Python stimulus above the DebugTransport line; only the branch taken differs.</text>
</svg>
