<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <marker id="arrowboth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a4a10"/>
    </marker>
  </defs>
  <rect width="1000" height="392" fill="#ffffff"/>

  <!-- ================= PANEL (a) CONVENTIONAL ================= -->
  <rect x="8" y="28" width="480" height="344" rx="5" fill="none" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="248" y="20" text-anchor="middle" font-size="15" font-weight="bold">(a) Conventional flow — two stimulus artifacts</text>

  <text x="128" y="46" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a4a7a">SIMULATION</text>
  <text x="368" y="46" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a4a10">HARDWARE</text>

  <!-- stimulus row -->
  <rect x="26" y="54" width="204" height="54" rx="4" fill="#dce9f7" stroke="#1a4a7a" stroke-width="1.6"/>
  <text x="128" y="75" text-anchor="middle" font-size="13">SystemVerilog / UVM</text>
  <text x="128" y="91" text-anchor="middle" font-size="13">sequence</text>
  <text x="128" y="103" text-anchor="middle" font-size="10.5" font-style="italic" fill="#333">written by hand</text>

  <rect x="266" y="54" width="204" height="54" rx="4" fill="#fbe8d2" stroke="#9a4a10" stroke-width="1.6"/>
  <text x="368" y="75" text-anchor="middle" font-size="13">OpenOCD TCL script</text>
  <text x="368" y="91" text-anchor="middle" font-size="13">(same scenario)</text>
  <text x="368" y="103" text-anchor="middle" font-size="10.5" font-style="italic" fill="#333">written again by hand</text>

  <line x1="234" y1="81" x2="262" y2="81" stroke="#9a4a10" stroke-width="1.6" stroke-dasharray="5,3"
        marker-start="url(#arrowboth)" marker-end="url(#arrowboth)"/>
  <text x="248" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a4a10">manual</text>
  <text x="248" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a4a10">re-encoding</text>

  <line x1="128" y1="108" x2="128" y2="146" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="368" y1="108" x2="368" y2="146" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- driver row -->
  <rect x="26" y="148" width="204" height="42" rx="4" fill="#dce9f7" stroke="#1a4a7a" stroke-width="1.6"/>
  <text x="128" y="174" text-anchor="middle" font-size="13">UVM testbench</text>
  <rect x="266" y="148" width="204" height="42" rx="4" fill="#fbe8d2" stroke="#9a4a10" stroke-width="1.6"/>
  <text x="368" y="174" text-anchor="middle" font-size="13">OpenOCD + JTAG probe</text>

  <line x1="128" y1="190" x2="128" y2="214" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="368" y1="190" x2="368" y2="214" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- DUT row -->
  <rect x="26" y="216" width="204" height="42" rx="4" fill="#c3dbf3" stroke="#1a4a7a" stroke-width="1.8"/>
  <text x="128" y="242" text-anchor="middle" font-size="13" font-weight="bold">DUT RTL (simulation)</text>
  <rect x="266" y="216" width="204" height="42" rx="4" fill="#f5d3ab" stroke="#9a4a10" stroke-width="1.8"/>
  <text x="368" y="242" text-anchor="middle" font-size="13" font-weight="bold">FPGA board</text>

  <!-- consequence note -->
  <rect x="26" y="274" width="444" height="82" rx="4" fill="#f6f0ee" stroke="#9a4a10" stroke-width="1.3"/>
  <text x="248" y="295" text-anchor="middle" font-size="12.5" font-weight="bold">2 artifacts per scenario, each with its own checker</text>
  <text x="248" y="315" text-anchor="middle" font-size="12">duplicated effort · divergent coverage</text>
  <text x="248" y="335" text-anchor="middle" font-size="12">a bench failure cannot be replayed in simulation</text>

  <!-- ================= PANEL (b) THIS FRAMEWORK ================= -->
  <rect x="512" y="28" width="480" height="344" rx="5" fill="none" stroke="#bbbbbb" stroke-width="1.2"/>
  <text x="752" y="20" text-anchor="middle" font-size="15" font-weight="bold">(b) This framework — one stimulus artifact</text>

  <rect x="592" y="40" width="320" height="44" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
  <text x="752" y="60" text-anchor="middle" font-size="13.5" font-weight="bold">Python debug scenario</text>
  <text x="752" y="76" text-anchor="middle" font-size="11.5">one file, written once</text>
  <line x1="752" y1="84" x2="752" y2="98" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="592" y="100" width="320" height="36" rx="4" fill="#ffffff" stroke="#000000" stroke-width="1.6"/>
  <text x="752" y="123" text-anchor="middle" font-size="13">RISCVDebug command API</text>
  <line x1="752" y1="136" x2="752" y2="150" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="612" y="152" width="280" height="42" rx="4" fill="#f2f2f2" stroke="#000000" stroke-width="1.6"/>
  <rect x="617" y="157" width="270" height="32" rx="3" fill="none" stroke="#000000" stroke-width="1"/>
  <text x="752" y="171" text-anchor="middle" font-size="13" font-weight="bold">DebugTransport</text>
  <text x="752" y="185" text-anchor="middle" font-size="10.5" font-style="italic">abstract interface</text>

  <line x1="528" y1="202" x2="976" y2="202" stroke="#666666" stroke-width="1.1" stroke-dasharray="6,4"/>
  <text x="976" y="214" text-anchor="end" font-size="10.5" font-style="italic" fill="#666">transport seam — everything above is identical</text>

  <line x1="752" y1="194" x2="752" y2="222" stroke="#000" stroke-width="1.6"/>
  <line x1="632" y1="222" x2="872" y2="222" stroke="#000" stroke-width="1.6"/>
  <line x1="632" y1="222" x2="632" y2="238" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="872" y1="222" x2="872" y2="238" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="530" y="240" width="204" height="44" rx="4" fill="#dce9f7" stroke="#1a4a7a" stroke-width="1.6"/>
  <text x="632" y="260" text-anchor="middle" font-size="12.5">UVM transport</text>
  <text x="632" y="276" text-anchor="middle" font-size="11">socket + DPI-C bridge</text>

  <rect x="770" y="240" width="204" height="44" rx="4" fill="#fbe8d2" stroke="#9a4a10" stroke-width="1.6"/>
  <text x="872" y="260" text-anchor="middle" font-size="12.5">OpenOCD transport</text>
  <text x="872" y="276" text-anchor="middle" font-size="11">JTAG</text>

  <line x1="632" y1="284" x2="632" y2="300" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="872" y1="284" x2="872" y2="300" stroke="#000" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="530" y="302" width="204" height="38" rx="4" fill="#c3dbf3" stroke="#1a4a7a" stroke-width="1.8"/>
  <text x="632" y="326" text-anchor="middle" font-size="12.5" font-weight="bold">DUT RTL (simulation)</text>
  <rect x="770" y="302" width="204" height="38" rx="4" fill="#f5d3ab" stroke="#9a4a10" stroke-width="1.8"/>
  <text x="872" y="326" text-anchor="middle" font-size="12.5" font-weight="bold">FPGA board</text>

  <!-- reference model: simulation side only -->
  <rect x="530" y="348" width="204" height="20" rx="3" fill="#eef2f8" stroke="#1a4a7a" stroke-width="1.2"/>
  <text x="632" y="362" text-anchor="middle" font-size="10" font-weight="bold">spec-derived reference model</text>
  <line x1="632" y1="340" x2="632" y2="348" stroke="#1a4a7a" stroke-width="1.3"/>
  <text x="872" y="357" text-anchor="middle" font-size="10" fill="#333">checked by the scenario's</text>
  <text x="872" y="368" text-anchor="middle" font-size="10" fill="#333">own step assertions</text>
</svg>
