# regression.yaml — the full CVA6 Debug VIP regression.
#
# One entry per test. `make regress` (see mk/regress.mk) runs them all, collects
# each run's output under sim_outputs/<name>/, and reports a verdict table plus
# merged functional coverage.
#
# Every entry names the ELF it needs. A scenario running against the wrong
# program does not fail -- it passes while covering nothing, which is how
# step_stall once reported 9/9 against halt_probe.elf. The ELF is part of the
# test, not a default.
#
# `expect` is the known state today, not an aspiration:
#   pass     every step passes
#   fail     a known RTL defect makes it fail; see testplans/results/rtl_findings.md
#   partial  runs but aborts before its verdict, blocked behind a known defect
#
# A test whose result differs from `expect` is what the regression is for.

suite: cva6-debug-vip
description: >-
  RISC-V Debug Module verification against CVA6 (cv64a6_imafdc_sv39) with the
  10x-Engineers riscv-dbg fork. Functional coverage is collected per run and
  merged across the suite.

defaults:
  elf: sw/halt_probe.elf
  timeout_s: 900
  expect: pass

tests:

  # ── Discovery and activation ──────────────────────────────────────────
  - name: discovery
    config: configs/discovery_uvm.json
    covers: [DIS-001, DIS-002, RST-025]
    why: Version detection and IDCODE, before anything else is trusted.

  - name: dm_activation
    config: configs/dm_activation_uvm.json
    covers: [ACT-001, ACT-002, ACT-003, RAP-040]
    why: >-
      Activation, and the check that registers beyond dmstatus.version read
      sanely -- version reads correctly even on a dead DM.

  - name: read_dmstatus
    config: configs/read_dmstatus_uvm.json
    covers: [RST-031, DIS-001]
    why: The minimal smoke test; if this fails nothing else is meaningful.

  # ── Run control ───────────────────────────────────────────────────────
  - name: halt
    config: configs/halt_uvm.json
    covers: [HALT-001, HALT-002, RC-001]
    why: >-
      Was partial: aborted on the RTL-002 sbcs mismatch. Passes since the model
      honours a hardwired sbaccess (7f7f384) -- 8/8 in every run since.

  - name: run_control
    config: configs/run_control_uvm.json
    covers: [HALT-001, RES-001, RES-002, RES-003, RES-007-V]
    why: Halt and resume, including the section 3.5 resumeack asymmetry.

  - name: report_halt_status
    config: configs/report_halt_status_uvm.json
    covers: [HALT-006, DIS-007]
    why: haltsum0 reflects the halted hart.

  - name: hart_selection
    config: configs/hart_selection_uvm.json
    covers: [HS-001, HS-002]
    expect: partial
    why: >-
      RTL-003 -- a nonexistent hart reports allrunning=1. It aborts on that
      mismatch before reaching a verdict, so `partial` rather than `fail`.
      Kept in the suite rather than waived so a fix is visible.

  # ── Reset ─────────────────────────────────────────────────────────────
  - name: reset_ctrl
    config: configs/reset_ctrl_uvm.json
    covers: [RST-010, RST-011, RST-060, RST-062, RST-064-V]
    why: ndmreset and hartreset scope, and the havereset lifecycle.

  - name: halt_on_reset
    config: configs/halt_on_reset_uvm.json
    covers: [RST-053, HALT-013]
    why: >-
      hasresethaltreq=0 on this DUT (RTL-004), so this exercises the portable
      substitute: haltreq asserted while ndmreset is held.

  # ── Abstract commands and program buffer ──────────────────────────────
  - name: gpr_write
    config: configs/gpr_write_uvm.json
    covers: [AC-001, AC-002, RAP-025]
    why: Access Register read and write round-trip.

  - name: csr_access
    config: configs/csr_access_uvm.json
    covers: [AC-004, RAP-020, RAP-023]
    why: >-
      CSR access through Access Register, using dscratch0/1. TC-DCSR-003 reads
      hartinfo.nscratch and requires what the DM owes for that value: the
      registers hold while the hart is halted and nothing else runs, and stay
      accessible after the DM has used them as scratch. It used to assert that
      the debugger's value survives a resume, which the DM never promised with
      nscratch=2.

  - name: cmderr
    config: configs/cmderr_uvm.json
    covers: [AC-005, AC-006, AC-007, AC-008, AC-009, AC-013, AC-018, AC-019, AC-022-V]
    why: >-
      Every abstract-command error class, and the stickiness of cmderr across a
      subsequent VALID command.

  - name: program_buffer
    config: configs/program_buffer_uvm.json
    covers: [PB-001, PB-002, PB-004, AC-010]
    why: Program buffer execution and the implicit ebreak.

  - name: sw_breakpoint_progbuf
    config: configs/sw_breakpoint_progbuf_uvm.json
    covers: [PB-005, DM-001, DM-003]
    why: ebreak entry and an exception raised inside the buffer.

  # ── Single-step ───────────────────────────────────────────────────────
  - name: single_step
    config: configs/single_step_uvm.json
    covers: [SSTEP-001, SSTEP-012, SSTEP-013]
    why: The basic step, and that clearing dcsr.step returns to free running.

  - name: step_stall
    config: configs/step_stall_uvm.json
    elf: sw/step_stall_probe.elf
    covers: [SSTEP-004, RTL-001]
    why: >-
      The wfi step. Regression for RTL-001 -- it passes only with the
      csr_regfile fix applied, and deadlocks without it.

  - name: step_classes
    config: configs/step_classes_uvm.json
    elf: sw/step_classes.elf
    covers: [SSTEP-014-V, SSTEP-019, SSTEP-015]
    why: >-
      One instruction of every class the step coverage bins: ordinary,
      compressed, load, store, taken and not-taken branch, trap, privilege
      change, wfi.

  - name: priv_irq
    config: configs/priv_irq_uvm.json
    elf: sw/priv_walk.elf
    timeout_s: 2400
    covers: [DM-011-V, SSTEP-006, SSTEP-007, SSTEP-018-V, SSTEP-022-V]
    why: >-
      Cycles M -> S -> U with a timer interrupt left pending, and catches each
      privilege by halting the freely running hart. The dwell between resume
      and halt is swept in TCK ticks: a dwell measured in host time, or in
      whole DMI reads, stays phase-locked to the program's own loop and lands
      in the same block every time (first always U, then always M).
    expect: fail
    known: >-
      7/10. The halt phase now catches all three privileges (U, S and M). The
      two step passes fail on RTL-011 (#159): a stepped mret/sret reports the
      pre-return privilege and the resume puts that privilege back, so the
      program's privilege walk is undone one step at a time -- the hart
      executes the S and U blocks (dpc walks through them) but always in M.
      Not a test-side problem: stepping cannot leave M on this DUT.

  # ── Triggers and external ─────────────────────────────────────────────
  - name: trigger
    config: configs/trigger_uvm.json
    covers: [TRIG-001, TRIG-002, TRIG-006]
    why: Trigger enumeration and disable.
    expect: fail
    known: >-
      TC-TRIG-006 fails on RTL-013 (#162): on RV64 CVA6 ignores tdata1=0, so an
      armed mcontrol6 trigger still reads 0x6000000000000044 after the disable.

  - name: external_trigger
    config: configs/external_trigger_uvm.json
    covers: [HG-003, RST-041]
    why: dmcs2 external trigger into a halt group.

  # ── System bus ────────────────────────────────────────────────────────
  - name: sba
    config: configs/sba_uvm.json
    covers: [SBA-001, SBA-002]
    why: >-
      SBA discovery, round-trips and sbbusyerror. Was partial behind RTL-002;
      passes since the model honours a hardwired sbaccess (7f7f384). The
      access-size bins still wait on RTL-002 (see cg_sba).

  - name: mem_scan
    config: configs/mem_scan_uvm.json
    covers: [PB-002, PB-003]
    why: Memory read through the program buffer.

  - name: cmd_busy
    config: configs/cmd_busy_uvm.json
    covers: [AC-020, AC-021, AC-022, AC-023, AC-024, AC-025, AC-026, AC-027, AC-028]
    why: >-
      DMI access while an abstract command is in flight. Six busy-guard sites in
      dm_csrs.sv were dead because every other scenario waits for its command;
      this one holds cmdbusy with a Program Buffer delay loop and races it.
      Also covers writes to R/O registers, abstractauto, and keepalive.
    expect: pass

  - name: dmi_error
    config: configs/dmi_error_uvm.json
    covers: [DTM-002, DTM-010, DTM-011, DTM-012, DTM-013, DTM-014, DTM-015,
             DTM-017, DTM-018, DTM-019]
    expect: fail
    why: >-
      The DTM on its own: dtmcs, IDCODE and BYPASS, a provoked sticky busy,
      dmireset, dmihardreset, Test-Logic-Reset and every TAP transition. Needs
      the dtmcs, raw DMI scan, raw JTAG scan and TMS-walk transport ops. Fails
      exactly one step, TC-DTM-012, on RTL-009 (dmihardreset not implemented);
      10/11 is the known state.

  - name: dm_corners
    config: configs/dm_corners_uvm.json
    covers: [DMC-001, DMC-002, DMC-003, DMC-004, DMC-005, DMC-006, DMC-007, DMC-008,
             DMC-009, DMC-010]
    expect: fail
    why: >-
      Debug Module code no ordinary flow reaches, found by code coverage: a
      flag poll with a nonexistent hart selected, SBA into the DM's own memory,
      DMI access while a system bus transfer is held busy under ndmreset,
      every writable register bit both ways, and the 64-bit bus halves. Fails
      exactly three steps on known RTL defects: TC-DMC-001 (RTL-008, dmstatus
      reads X for a nonexistent hart), TC-DMC-007 (RTL-006, sbcs reserved bits
      read back as written) and TC-DMC-008 (RTL-007, haltsum1-3 read X).
      9/12 is the known state.

  - name: debug_entry
    config: configs/debug_entry_uvm.json
    elf: sw/step_classes.elf
    covers: [DCSR-010, DCSR-011, DCSR-012, DCSR-013, DCSR-014, DCSR-015]
    timeout_s: 1500
    why: >-
      dcsr.cause values that come from the hart's own execution rather than from
      a DMI write, at every privilege: ebreak in M, S and U (ebreakm/s/u), a halt
      request that interrupts S and U code, and a step from S and U. Checks the
      ebreakm=0 negative case first (the ebreak must trap, mcause=3), or the
      positive test passes for the wrong reason. dpc is written 64-bit -- a
      32-bit write sign-extends to 0xFFFFFFFF8000xxxx and the hart faults, which
      is what this test used to report as 5/7. TC-DCSR-011 resumes the hart one
      instruction before an armed mcontrol6 execute trigger and sends no halt
      request.
    expect: fail
    known: >-
      TC-DCSR-011 fails on RTL-012 (#161): the trigger fires (the hart halts by
      itself with dpc on the target) but dcsr.cause reads 3, not 2.

  - name: step_matrix
    config: configs/step_matrix_uvm.json
    elf: sw/step_classes.elf
    covers: [SSTEP-006, SSTEP-007, SSTEP-008, SSTEP-009, SSTEP-015, SSTEP-019,
             SSTEP-020, SSTEP-021-V, SSTEP-022-V]
    timeout_s: 3000
    why: >-
      Steps every instruction class in step_loop under each stepie x
      interrupt-pending combination in M, in runs long enough for the
      consecutive-step bins, then from S and U, and an sret stepped in S.
      The pending interrupt is the CLINT timer (mtimecmp resets to 0) gated by
      mie.MTIE, with mstatus.MIE=0 so M never takes it. Every trap and xRET
      step is checked for where Sdext says it must land.
    expect: fail
    known: >-
      The Sdext check step fails on two CVA6 single-step defects; every other
      step passes. RTL-010 (openhwgroup/cva6#3429): a stepped instruction that
      traps halts only after the handler's first instruction has run, because
      step entry is gated on commit_ack, which a trapping instruction never
      gets. RTL-011: a stepped mret/sret reports dpc=pc+4 and the old dcsr.prv,
      because csr_regfile tests eret_o before the same always_comb assigns it.
      The sequence repairs dpc/prv after each xRET so the U and S runs still
      cover their classes.

  # ── Native debug: riscv-arch-test (ACT4) Sdtrig programs ──────────────
  # Self-checking firmware; no debugger involvement until the verdict. Built
  # and staged by `bash mk/act_build.sh`, which also writes the configs. The
  # reference results come from Spike, because Sail has no Sdtrig.
  - name: act_sdtrig_access
    timeout_s: 2400        # the coverage build is far slower; these poll over SBA
    config: configs/act/SdtrigSm_Access-00.json
    elf: sw/act/SdtrigSm_Access-00.elf
    covers: [NATIVE-OP2, TRIG-001]
    why: M-mode access to every trigger CSR, and tselect/tdata legalization.

  - name: act_sdtrig_mcontrol6
    timeout_s: 2400        # the coverage build is far slower; these poll over SBA
    config: configs/act/SdtrigSm_Mcontrol6-00.json
    elf: sw/act/SdtrigSm_Mcontrol6-00.elf
    covers: [NATIVE-OP2, NATIVE-OP5]
    why: >-
      mcontrol6 execute/load/store triggers with action=0 across match types,
      firing as breakpoint exceptions, and the hit bits.
    expect: fail
    known: >-
      The program fails its own trap check on RTL-013 (#162): trigger 0 is
      "disabled" with tdata1=0, stays armed, and traps the next store to scratch
      (PC 0x80000280); Spike, the reference, does not.

  - name: act_sdtrig_icount
    timeout_s: 2400        # the coverage build is far slower; these poll over SBA
    config: configs/act/SdtrigSm_Icount-00.json
    elf: sw/act/SdtrigSm_Icount-00.elf
    covers: [NATIVE-OP3]
    why: >-
      M-mode icount triggers: firing after `count` instructions and not firing
      with the mode disabled. Upstream wrote these cases but left them
      commented out; mk/act_build.sh switches them on.
    expect: fail
    known: >-
      Fails on RTL-014 (#163): with the trigger disabled for the current mode,
      tdata1 must still read count=9 (Spike: 0x3000000000002400); CVA6 counted
      the instructions anyway and reads count=0.

  # Upstream's SdtrigSm Itrigger and NativeTriggers programs are not run: their
  # generator bodies are empty or commented out (riscv-arch-test act4, "only
  # the mcontrol6 covergroup is fully developed"), so they pass without arming a
  # single trigger. The cases they were meant to cover are the native_*
  # programs below.

  # ── Native debug: own self-checking programs (sw/native_*.S) ───────────
  - name: native_icount
    timeout_s: 2400        # the coverage build is far slower; these poll over SBA
    config: configs/native/native_icount.json
    elf: sw/native_icount.elf
    covers: [NATIVE-OP3]
    why: >-
      icount single-step of U-mode code from an M-mode monitor: count 1 and 2,
      breakpoint with mepc on the next instruction, tval 0, pending cleared;
      and no firing with every mode bit clear.
    expect: fail
    known: >-
      Check 0x12 fails on RTL-014 (#163): the count runs down in M before U
      starts, and the breakpoint is taken on entry to U with a stale M mepc.

  - name: native_etrigger
    timeout_s: 2400        # the coverage build is far slower; these poll over SBA
    config: configs/native/native_etrigger.json
    elf: sw/native_etrigger.elf
    covers: [NATIVE-OP2]
    why: >-
      etrigger on an illegal instruction delegated to S: breakpoint to M before
      the S handler's first instruction (mepc=stvec, tval=0, MPP=S), original
      scause/sepc intact, hit set; not fired when enabled for U only.
    expect: fail
    known: >-
      Check 0x21 fails on RTL-015 (#164): the trigger never matches in S
      (scontext check without textra), so no breakpoint precedes the S handler.

  - name: native_itrigger
    timeout_s: 2400        # the coverage build is far slower; these poll over SBA
    config: configs/native/native_itrigger.json
    elf: sw/native_itrigger.elf
    covers: [NATIVE-OP2]
    why: >-
      itrigger on the supervisor software interrupt, delegated to S and taken
      from U: breakpoint to M before the S handler runs; not fired when enabled
      for S only.
    expect: fail
    known: >-
      Check 0x22 fails on RTL-016 (#165): the breakpoint comes after the S
      handler has returned (mepc=u_done2), not at stvec.

  - name: native_hit
    timeout_s: 2400        # the coverage build is far slower; these poll over SBA
    config: configs/native/native_hit.json
    elf: sw/native_hit.elf
    covers: [NATIVE-OP5]
    why: >-
      Two U-mode execute triggers: each breakpoint sets hit0 on the trigger that
      fired and no other, and tval is the matched address.

  - name: native_reentrancy
    timeout_s: 2400        # the coverage build is far slower; these poll over SBA
    config: configs/native/native_reentrancy.json
    elf: sw/native_reentrancy.elf
    covers: [NATIVE-OP4]
    why: >-
      No tcontrol, so an M-mode action=0 trigger must not fire while MIE=0
      (inside the trap handler); it must fire with MIE=1.
    expect: fail
    known: >-
      Check 0x22 fails on RTL-017 (#166): the M-mode trigger fires inside the
      trap handler with MIE=0 (a Sdtrig SHOULD).

  - name: native_dbgcsr
    timeout_s: 2400        # the coverage build is far slower; these poll over SBA
    config: configs/native/native_dbgcsr.json
    elf: sw/native_dbgcsr.elf
    covers: [NATIVE-OP7]
    why: dcsr, dpc, dscratch0/1 read or written from M-mode raise illegal instruction.
