adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9824

# TCL server for Python transport
tcl_port 6666

transport select jtag

# CVA6 SoC uses default IDCODE (dmi_jtag instantiated without IdcodeValue parameter)
set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00000001

target create $_CHIPNAME.cpu riscv -chain-position $_CHIPNAME.cpu

init
halt
